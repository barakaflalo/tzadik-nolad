html[data-theme="gold"]  {--ac:#d4af37;--acl:#7a5f00}

html[data-theme="green"] {--ac:#4cc38a;--acl:#0d7a47}
html[data-theme="purple"]{--ac:#b18cff;--acl:#5b32b4}

body{overflow:hidden}
button{font:inherit;color:inherit}

header{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--bd);background:var(--bg);z-index:40;min-width:0}

.ib svg{width:24px;height:24px}
[dir=ltr] .back svg{transform:scaleX(-1)}
#view{overflow-y:auto;overflow-x:hidden;padding:14px 14px 28px;min-width:0}
nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:64px;border-top:1px solid var(--bd);background:var(--bg);padding-bottom:env(safe-area-inset-bottom);z-index:40}

nav button.on{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;min-width:0}

.mu{color:var(--mu)} .sm{font-size:13px}
.btn{min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--ac);background:none;color:var(--ac);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--ac);color:var(--on)}
.btn.danger{border-color:var(--dng);color:var(--dng)}
.btn.blk{display:flex;width:100%}
.btn[aria-pressed=true]{background:var(--ac);color:var(--on)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.big button{min-height:92px;border-radius:16px;border:1px solid var(--ac);background:var(--card);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:17px;font-weight:700;cursor:pointer}
.big svg{width:30px;height:30px;color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;mask-image:linear-gradient(to left,#000 92%,transparent)}

.chip.on{border-color:var(--ac);color:var(--ac);font-weight:700}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--bd);color:var(--mu);vertical-align:middle}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:start;min-height:52px;padding:10px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
.item .t{flex:1;min-width:0}
.item .t b{display:block;overflow-wrap:anywhere}
.item.core{border-color:var(--ac)}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{width:92px;height:92px;flex:none}
.ring .num{font-size:28px;font-weight:800;color:var(--ac)}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.mc{width:42px;height:42px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13px;cursor:pointer;padding:0}
.mc.l{border-color:var(--ac);color:var(--ac)}
.mc.d{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
.mc.na{opacity:.45;text-decoration:line-through}
.gh{margin:6px 0 8px;font-weight:700;color:var(--mu);font-size:14px}
label.f{display:block;margin:10px 0 4px;font-size:14px;color:var(--mu)}
input[type=text],select{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px 12px;font-size:16px}
input[type=range]{width:100%;accent-color:var(--ac)}
.dots{display:flex;gap:10px}
.dot{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.dot.on{border-color:var(--tx)}
.reader{font-family:var(--read);font-size:var(--fs);line-height:1.9}
.reader .seg{margin:0 0 14px}
.reader .en{font-family:var(--ui);font-size:.72em;color:var(--mu);line-height:1.6;margin:-8px 0 16px}

.seg.rb{margin:-6px 0 14px}
.grp{font-family:var(--ui);font-size:14px;color:var(--mu);margin:26px 0 4px;letter-spacing:.3px}
.pt{font-family:var(--ui);font-size:17px;color:var(--ac);margin:18px 0 8px;scroll-margin-top:8px}
.jump{margin-bottom:12px}

.tts .ib{width:50px;height:50px}

.mtxt{line-height:1.7;margin:4px 0 14px}
.mbtns{display:flex;flex-direction:column;gap:8px;margin-top:12px}

.wiz .box{width:100%;max-width:460px}
.wiz h2{color:var(--ac);font-size:24px;margin:0 0 10px}
.wiz p{line-height:1.7}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function importBackup(inp) {

    let h = '';
    if (step === 0) h = '<h2>' + esc(T('onbTitle')) + '</h2><p>' + esc(T('onbBody')) + '</p><p class="mu sm">' + esc(T('disclaimer')) + '</p><h3>' + esc(T('onbWho')) + '</h3>' +
      '<button class="opt ' + (S.audience === 'new' ? 'on' : '') + '" data-w="aud" data-v="new">' + esc(T('audNew')) + '</button><button class="opt ' + (S.audience === 'known' ? 'on' : '') + '" data-w="aud" data-v="known">' + esc(T('audKnown')) + '</button>';
    else if (step === 1) h = '<h2>' + esc(T('onbNusachT')) + '</h2>' + ['ashkenaz', 'sefard', 'edot'].map(function (n) { return '<button class="opt ' + (S.nusach === n ? 'on' : '') + '" data-w="nus" data-v="' + n + '">' + esc(nuName(n)) + '</button>'; }).join('') + '<p class="mu sm">' + esc(T('nusachNote')) + '</p>';
    else h = '<h2>' + esc(T('onbNameT')) + '</h2><input type="text" id="wName" value="' + esc(S.user) + '" maxlength="40" placeholder="' + esc(T('onbNameHint')) + '" autocomplete="off">';
    w.innerHTML = '<div class="box">' + dots + h + '<div class="mbtns"><button class="btn pri" data-w="next">' + esc(step === 2 ? T('start') : T('next')) + '</button>' + (step < 2 ? '<button class="btn" data-w="skip">' + esc(T('skip')) + '</button>' : '') + '</div></div>';
  };
  const finish = function () { const n = $('#wName', w); if (n) S.user = n.value.slice(0, 40); S.onboarded = true; save(); w.remove(); render(); };
  w.addEventListener('click', function (e) {
    const b = e.target.closest('[data-w]'); if (!b) return; const k = b.dataset.w;
    if (k === 'aud') { S.audience = b.dataset.v; save(); draw(); }
    else if (k === 'nus') { S.nusach = b.dataset.v; save(); draw(); }
    else if (k === 'next') { if (step === 2) finish(); else { step++; draw(); } }
    else if (k === 'skip') finish();
  });
  document.body.appendChild(w); draw();
}

/* ───── אתחול ───── */
function init() {
  apply();
  history.replaceState({ r: 1 }, ''); history.pushState({ g: 1 }, '');
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  const q = new URLSearchParams(location.search), go0 = q.get('go');
  if (go0 && SCREENS[go0] && go0 !== 'reader') { R.screen = go0; history.replaceState({ g: 1 }, '', location.pathname); }
  loadCore().then(function () { render(); wizard(); });
  render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !/[?&]nosw/.test(location.search)) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
}
init();
</script>
