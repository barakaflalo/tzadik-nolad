.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--bd);color:var(--mu);vertical-align:middle}

.gi{width:56px;height:56px;flex:none;border-radius:12px;background:#fff8e6;padding:2px}
.gh-art{display:block;width:120px;height:120px;margin:6px auto 2px;border-radius:18px;background:#fff8e6;padding:4px}

.ring{display:flex;align-items:center;gap:16px}
.ring svg{width:92px;height:92px;flex:none}

.grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.mc{width:42px;height:42px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13px;cursor:pointer;padding:0}
.mc.l{border-color:var(--ac);color:var(--ac)}
.mc.d{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
.mc.na{opacity:.45;text-decoration:line-through}
.gh{margin:6px 0 8px;font-weight:700;color:var(--mu);font-size:14px}

/* ───── גיבוי ושחזור (פורמט אחד: {app, version, exportedAt, user, data}) ───── */
function exportBackup() {
  const out = { app: 'tzadik-nolad', version: VERSION, exportedAt: new Date().toISOString(), user: S.user, data: { state: S } };
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], { type: 'application/json' }));
  a.download = 'tzadik-nolad-' + (S.user ? safeName(S.user) + '-' : '') + today() + '.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000); S.lastBackup = Date.now(); save(); toast(T('exported'));
}
/* בדיקת תקינות ושיקום מצב — מקבלת רק שדות מוכרים מהסוג הנכון; כל השאר נזרק */
function cleanState(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
  const o = Object.assign({}, DEF), isO = function (x) { return x && typeof x === 'object' && !Array.isArray(x); };
  const str = function (k, ok, max) { if (typeof raw[k] === 'string' && (!ok || ok.indexOf(raw[k]) > -1)) o[k] = raw[k].slice(0, max || 60); };
  str('city', null, 40); str('lang', ['he', 'en']); str('theme', ['gold', 'blue', 'green', 'purple', 'red']); str('mode', ['dark', 'light', 'auto']);
  str('nusach', ['ashkenaz', 'sefard', 'edot']); str('audience', ['', 'new', 'known']); str('user', null, 40);
  if (typeof raw.candle === 'number' && raw.candle >= 0 && raw.candle <= 90) o.candle = raw.candle;
  if (typeof raw.fs === 'number' && raw.fs >= 12 && raw.fs <= 60) o.fs = raw.fs;
  ['showEn', 'onboarded'].forEach(function (k) { if (typeof raw[k] === 'boolean') o[k] = raw[k]; });
  if (typeof raw.lastBackup === 'number') o.lastBackup = raw.lastBackup;
  if (isO(raw.gps) && isFinite(raw.gps.lat) && isFinite(raw.gps.lon)) o.gps = { lat: +raw.gps.lat, lon: +raw.gps.lon, tz: typeof raw.gps.tz === 'string' ? raw.gps.tz.slice(0, 60) : 'UTC' };
  o.marks = {}; if (isO(raw.marks)) Object.keys(raw.marks).forEach(function (id) {
    const m = raw.marks[id]; if (!isO(m) || id.length > 20) return; const c = {};
    if (m.l) c.l = (typeof m.l === 'string' || typeof m.l === 'number') ? m.l : 1; if (m.na) c.na = 1;
    if (Array.isArray(m.d)) c.d = m.d.filter(function (x) { return typeof x === 'string' && x.length <= 12; }).slice(-400);
    if (Object.keys(c).length) o.marks[id] = c;
  });
  o.tehDays = {}; if (isO(raw.tehDays)) Object.keys(raw.tehDays).forEach(function (d) { if (/^\d{4}-\d{2}-\d{2}$/.test(d) && raw.tehDays[d]) o.tehDays[d] = 1; });
  if (isO(raw.tts)) { o.tts = {}; if (typeof raw.tts.rate === 'number' && raw.tts.rate >= 0.3 && raw.tts.rate <= 2.5) o.tts.rate = raw.tts.rate; ['noNik', 'skipRub'].forEach(function (k) { if (typeof raw.tts[k] === 'boolean') o.tts[k] = raw.tts[k]; }); }
  if (isO(raw.path)) { o.path = {}; Object.keys(raw.path).forEach(function (k) { if (/^d\d{1,2}$/.test(k) && typeof raw.path[k] === 'string') o.path[k] = raw.path[k].slice(0, 12); }); }
  if (isO(raw.last) && raw.last.kind === 'siddur' && typeof raw.last.nu === 'string' && typeof raw.last.id === 'string') o.last = { kind: 'siddur', title: String(raw.last.title || '').slice(0, 120), nu: raw.last.nu.slice(0, 20), id: raw.last.id.slice(0, 60) };
  if (o.last && typeof raw.last.pos === 'string' && /^p\d{1,3}$/.test(raw.last.pos)) o.last.pos = raw.last.pos;
  return o;
}
function importBackup(inp) {
  const f = inp.files && inp.files[0]; inp.value = ''; if (!f) return;
  if (f.size > 5e6) { toast(T('importBad')); return; }
  const rd = new FileReader();
  rd.onload = function () {
    let j; try { j = JSON.parse(rd.result); } catch (e) { toast(T('importBad')); return; }
    if (!j || j.app !== 'tzadik-nolad' || !j.data || !j.data.state) { toast(T('importBad')); return; }
    const ns = cleanState(j.data.state); if (!ns) { toast(T('importBad')); return; }
    appConfirm(T('importAsk')).then(function (ok) {
      if (!ok) return;
      const prev = JSON.stringify(S); store.set('state_prev', prev);          /* עותק של המצב הקודם */
      const old = S; S = ns;
      if (!save() || store.get('state') !== JSON.stringify(S)) { S = old; toast(T('importFail')); return; }
      apply(); render(); toast(T('imported'));
    });
  };
  rd.readAsText(f);
}

/* ───── מדריך פתיחה (חלון הסכמה — מחוץ למחסנית החלונות, חזרה לא עוקפת אותו) ───── */
function wizard() {
  if (S.onboarded) return;
  let step = 0; const w = document.createElement('div'); w.className = 'wiz';
  const draw = function () {
    const dots = '<div class="steps">' + [0, 1, 2].map(function (i) { return '<i class="' + (i === step ? 'on' : '') + '"></i>'; }).join('') + '</div>';
    let h = '';
    if (step === 0) h = '<h2>' + esc(T('onbTitle')) + '</h2><p>' + esc(T('onbBody')) + '</p><p class="mu sm">' + esc(T('disclaimer')) + '</p><h3>' + esc(T('onbWho')) + '</h3>' +
      '<button class="opt ' + (S.audience === 'new' ? 'on' : '') + '" data-w="aud" data-v="new">' + esc(T('audNew')) + '</button><button class="opt ' + (S.audience === 'known' ? 'on' : '') + '" data-w="aud" data-v="known">' + esc(T('audKnown')) + '</button>';
    else if (step === 1) h = '<h2>' + esc(T('onbNusachT')) + '</h2>' + ['ashkenaz', 'sefard', 'edot'].map(function (n) { return '<button class="opt ' + (S.nusach === n ? 'on' : '') + '" data-w="nus" data-v="' + n + '">' + esc(nuName(n)) + '</button>'; }).join('') + '<p class="mu sm">' + esc(T('nusachNote')) + '</p>';
    else h = '<h2>' + esc(T('onbNameT')) + '</h2><input type="text" id="wName" value="' + esc(S.user) + '" maxlength="40" placeholder="' + esc(T('onbNameHint')) + '" autocomplete="off">';
    w.innerHTML = '<div class="box">' + dots + h + '<div class="mbtns"><button class="btn pri" data-w="next">' + esc(step === 2 ? T('start') : T('next')) + '</button>' + (step < 2 ? '<button class="btn" data-w="skip">' + esc(T('skip')) + '</button>' : '') + '</div></div>';
  };
  const finish = function () { const n = $('#wName', w); if (n) S.user = n.value.slice(0, 40); S.onboarded = true; save(); w.remove(); render(); };
  w.addEventListener('click', function (e) {
    const b = e.target.closest('[data-w]'); if (!b) return; const k = b.dataset.w;
    if (k === 'aud') { S.audience = b.dataset.v; save(); draw(); }
    else if (k === 'nus') { S.nusach = b.dataset.v; save(); draw(); }
    else if (k === 'next') { if (step === 2) finish(); else { step++; draw(); } }
    else if (k === 'skip') finish();
  });
  document.body.appendChild(w); draw();
}

}
